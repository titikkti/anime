<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WibuSekai - Kho Tàng Anime</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #1a1a2e; 
            color: #fff; 
            text-align: center;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .overlay {
            background-color: rgba(26, 26, 46, 0.85);
            min-height: 100vh;
        }
        
        header { padding: 40px 20px; background: linear-gradient(135deg, rgba(22, 33, 62, 0.9), rgba(15, 52, 96, 0.9)); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); margin-bottom: 20px; }
        header h1 { font-size: 2.5rem; color: #e94560; text-shadow: 0 0 10px rgba(233, 69, 96, 0.5); margin-bottom: 10px; }
        header p { color: #a2a8d3; font-size: 1rem; font-style: italic; }

        /* Khung hiển thị nhỏ gọn */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
            justify-content: center;
        }
        
        .anime-card { 
            background-color: rgba(22, 33, 62, 0.95); 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            transition: transform 0.3s, box-shadow 0.3s; 
            max-width: 300px; 
            margin: 0 auto; 
            width: 100%;
        }
        
        .anime-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(233, 69, 96, 0.6); }
        
        .anime-card img { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            border-bottom: 3px solid #e94560; 
        }
        
        .card-info { padding: 15px 10px; }
        .card-info h3 { font-size: 1.1rem; margin-bottom: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .watch-btn { display: inline-block; background-color: #e94560; color: #fff; text-decoration: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; transition: all 0.3s; cursor: pointer;}
        .watch-btn:hover { background-color: #ff2a4b; box-shadow: 0 0 10px #ff2a4b; transform: scale(1.05); }

        footer { padding: 20px; background-color: rgba(15, 52, 96, 0.9); color: #a2a8d3; margin-top: 40px; font-size: 0.8rem; }
        #loading { font-size: 1.2rem; color: #e94560; margin: 40px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>🌸 WibuSekai 🌸</h1>
            <p>Thế giới Anime thu nhỏ của riêng bạn</p>
        </header>

        <main>
            <div id="loading">⏳ Đang kết nối dữ liệu...</div>
            <section class="gallery" id="anime-gallery"></section>
        </main>

        <footer>
            <p>© 2026 - Wibu Never Die ❤️</p>
        </footer>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1pKY9Rd3MiOf-MBIs-k6VvbB8dpTLQyU1H1tI6aWVcTDUNv-ZQA9YU6lNdhpLMLOXnvXL6J9FKK8I/pub?output=csv";

        const gallery = document.getElementById("anime-gallery");
        const loading = document.getElementById("loading");

        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                loading.style.display = "none";
                
                let bgSet = false;

                // Cài hình nền từ Google Sheets
                data.forEach(row => {
                    if (!bgSet && row.HinhNenWeb && row.HinhNenWeb.trim() !== "") {
                        document.body.style.backgroundImage = `url('${row.HinhNenWeb.trim()}')`;
                        document.body.style.backgroundSize = "cover";
                        document.body.style.backgroundAttachment = "fixed";
                        bgSet = true;
                    }
                });

                // Tạo các thẻ phim
                data.forEach(row => {
                    if(row.TenVideo && row.LinkAnh && row.LinkVideo && row.TenVideo.trim() !== "") {
                        const card = document.createElement("div");
                        card.className = "anime-card";
                        card.innerHTML = `
                            <img src="${row.LinkAnh.trim()}" alt="Ảnh bìa" onerror="this.src='https://via.placeholder.com/300x400?text=Loi+Anh'">
                            <div class="card-info">
                                <h3>${row.TenVideo.trim()}</h3>
                                <a class="watch-btn">▶ Xem Ngay</a>
                            </div>
                        `;

                        const btn = card.querySelector('.watch-btn');
                        btn.addEventListener('click', function(e) {
                            e.preventDefault(); 
                            // Chỉ mở video ở tab mới, không còn quảng cáo
                            window.open(row.LinkVideo.trim(), '_blank');
                        });

                        gallery.appendChild(card);
                    }
                });
            },
            error: function() {
                loading.innerText = "❌ Lỗi: Không thể tải dữ liệu. Hãy kiểm tra lại link CSV!";
            }
        });
    </script>
</body>
</html>
