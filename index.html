<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WibuSekai - Kho Tàng Anime & Truyện</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #1a1a2e; 
            color: #fff; 
            text-align: center;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .overlay {
            background-color: rgba(26, 26, 46, 0.85);
            min-height: 100vh;
        }
        
        header { padding: 30px 20px; background: linear-gradient(135deg, rgba(22, 33, 62, 0.9), rgba(15, 52, 96, 0.9)); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); margin-bottom: 20px; }
        header h1 { font-size: 2.2rem; color: #e94560; text-shadow: 0 0 10px rgba(233, 69, 96, 0.5); margin-bottom: 5px; }
        header p { color: #a2a8d3; font-size: 0.9rem; font-style: italic; }

        /* KHU VỰC NÚT CHUYỂN TAB (VIDEO / TRUYỆN) */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        
        .tab-btn {
            background-color: transparent;
            color: #a2a8d3;
            border: 2px solid #e94560;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
        }
        
        .tab-btn:hover {
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.4);
        }
        
        .tab-btn.active {
            background-color: #e94560;
            color: #fff;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
        }

        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
            max-width: 1100px; 
            margin: 0 auto; 
            justify-content: center;
            align-items: start; 
        }
        
        .anime-card { 
            background-color: rgba(22, 33, 62, 0.95); 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            transition: transform 0.3s, box-shadow 0.3s; 
            width: 100%;
        }
        
        .anime-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(233, 69, 96, 0.6); }
        
        .anime-card img { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-bottom: 3px solid #e94560; 
        }
        
        .card-info { padding: 15px 12px; }
        .card-info h3 { font-size: 1.1rem; margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .watch-btn { display: inline-block; background-color: #e94560; color: #fff; text-decoration: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; transition: all 0.3s; cursor: pointer;}
        .watch-btn:hover { background-color: #ff2a4b; box-shadow: 0 0 10px #ff2a4b; transform: scale(1.05); }

        footer { padding: 15px; background-color: rgba(15, 52, 96, 0.9); color: #a2a8d3; margin-top: 30px; font-size: 0.8rem; }
        #loading { font-size: 1.1rem; color: #e94560; margin: 30px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <h1>🌸 WibuSekai 🌸</h1>
            <p>Thế giới Anime thu nhỏ của riêng bạn</p>
        </header>

        <main>
            <!-- 2 Nút Tab -->
            <div class="tab-container" id="tabs" style="display: none;">
                <button class="tab-btn active" id="btn-video" onclick="switchTab('video')">📺 Kho Video</button>
                <button class="tab-btn" id="btn-truyen" onclick="switchTab('truyen')">📚 Kho Truyện</button>
            </div>

            <div id="loading">⏳ Đang kết nối dữ liệu...</div>
            
            <!-- 2 Khu vực chứa nội dung riêng biệt -->
            <section class="gallery" id="video-gallery"></section>
            <section class="gallery" id="truyen-gallery" style="display: none;"></section>
        </main>

        <footer>
            <p>© 2026 - Wibu Never Die ❤️</p>
        </footer>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1pKY9Rd3MiOf-MBIs-k6VvbB8dpTLQyU1H1tI6aWVcTDUNv-ZQA9YU6lNdhpLMLOXnvXL6J9FKK8I/pub?output=csv";

        const myAdLinks = [
            "https://vt.tiktok.com/ZS9h36wYouDLb-ojzE1/",
            "https://vt.tiktok.com/ZS9hwC35QqF5E-27l2e/",
            "https://cheaplyreqainthrift.com/kjwmjr2cc?key=bc9968dfe3a9f785791ad84123aa77de",
            "https://cheaplyreqainthrift.com/dv3xs68de?key=877289809972cac42e2b995f1b380545"
        ];

        // Chức năng chuyển đổi Tab (Video / Truyện)
        function switchTab(tabName) {
            if (tabName === 'video') {
                document.getElementById('video-gallery').style.display = 'grid';
                document.getElementById('truyen-gallery').style.display = 'none';
                document.getElementById('btn-video').classList.add('active');
                document.getElementById('btn-truyen').classList.remove('active');
            } else {
                document.getElementById('video-gallery').style.display = 'none';
                document.getElementById('truyen-gallery').style.display = 'grid';
                document.getElementById('btn-truyen').classList.add('active');
                document.getElementById('btn-video').classList.remove('active');
            }
        }

        const videoGallery = document.getElementById("video-gallery");
        const truyenGallery = document.getElementById("truyen-gallery");
        const loading = document.getElementById("loading");
        const tabsContainer = document.getElementById("tabs");

        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                loading.style.display = "none";
                tabsContainer.style.display = "flex"; // Hiện nút tab sau khi tải xong
                
                let bgSet = false;

                data.forEach(row => {
                    if (!bgSet && row.HinhNenWeb && row.HinhNenWeb.trim() !== "") {
                        document.body.style.backgroundImage = `url('${row.HinhNenWeb.trim()}')`;
                        document.body.style.backgroundSize = "cover";
                        document.body.style.backgroundAttachment = "fixed";
                        bgSet = true;
                    }
                });

                data.forEach(row => {
                    if(row.TenVideo && row.LinkAnh && row.LinkVideo && row.TenVideo.trim() !== "") {
                        // Xác định xem đây là truyện hay video dựa vào cột "Loai"
                        let isStory = false;
                        if (row.Loai && row.Loai.trim().toLowerCase() === "truyen") {
                            isStory = true;
                        }

                        const card = document.createElement("div");
                        card.className = "anime-card";
                        card.innerHTML = `
                            <img src="${row.LinkAnh.trim()}" alt="Ảnh bìa" onerror="this.src='https://via.placeholder.com/240x300?text=Loi+Anh'">
                            <div class="card-info">
                                <h3>${row.TenVideo.trim()}</h3>
                                <!-- Thay đổi nút dựa vào loại nội dung -->
                                <a class="watch-btn">${isStory ? '📖 Đọc Ngay' : '▶ Xem Ngay'}</a>
                            </div>
                        `;

                        const btn = card.querySelector('.watch-btn');
                        btn.addEventListener('click', function(e) {
                            e.preventDefault(); 
                            
                            let isAdTurn = sessionStorage.getItem('isAdTurn') !== 'false';
                            let currentAdIndex = parseInt(sessionStorage.getItem('adIndex') || '0');

                            if (myAdLinks.length > 0 && isAdTurn) {
                                let currentAdUrl = myAdLinks[currentAdIndex];
                                currentAdIndex = (currentAdIndex + 1) % myAdLinks.length;
                                
                                sessionStorage.setItem('isAdTurn', 'false');
                                sessionStorage.setItem('adIndex', currentAdIndex);
                                
                                window.location.href = currentAdUrl;
                            } else {
                                window.open(row.LinkVideo.trim(), '_blank');
                                sessionStorage.setItem('isAdTurn', 'true');
                            }
                        });

                        // Phân loại thẻ vào đúng Tab
                        if (isStory) {
                            truyenGallery.appendChild(card);
                        } else {
                            videoGallery.appendChild(card);
                        }
                    }
                });
            },
            error: function() {
                loading.innerText = "❌ Lỗi: Không thể tải dữ liệu. Hãy kiểm tra lại link CSV!";
            }
        });
    </script>
</body>
</html>
